name: Update profile card

on:
  schedule:
    - cron: "0 7 * * *" # every day at 04:00 in Salvador (UTC-3)
  push:
    branches: [main]
    paths: [today.py, art/**, requirements.txt, .github/workflows/build.yaml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-card

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Render SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: brprado
        run: python today.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          git diff --cached --quiet || { git commit -m "Update profile card"; git push; }
